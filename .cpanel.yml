---
deployment:
  tasks:
    - export LOG=$HOME/cpanel-deploy-test.log
    - export PATH=/opt/alt/alt-nodejs24/root/usr/bin:$PATH
    - date > $LOG
    - php -v >> $LOG 2>&1
    - node --version >> $LOG 2>&1
    - composer install --no-dev --no-scripts --no-interaction --no-progress >> $LOG 2>&1 || echo "composer install FAILED" >> $LOG
    - npm ci --no-audit --no-fund >> $LOG 2>&1 || echo "npm ci FAILED" >> $LOG
    - php artisan >> $LOG 2>&1 || echo "artisan FAILED" >> $LOG
    - node -e "console.log('npm package loaded ok:', require('is-number')(42))" >> $LOG 2>&1 || echo "npm package FAILED" >> $LOG
    - echo done >> $LOG